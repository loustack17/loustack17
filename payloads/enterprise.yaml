headline: >-
  Enterprise Backend Engineer | C#, .NET, SQL Server & Azure
summary: >-
  Enterprise backend engineer with 5+ years maintaining .NET and SQL Server systems across finance,
  member services, retail, and B2B. Work includes REST APIs, SQL performance tuning, brownfield
  production debugging, and Azure support. Recent contract work adds Python/FastAPI backend
  architecture and document automation for a Legal AI product.
