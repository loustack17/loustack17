headline: >-
  Backend Engineer | APIs, SQL & Cloud Infrastructure
summary: >-
  Backend engineer with 5+ years maintaining multi-client web systems and APIs. Strongest work is in
  .NET and SQL Server: API design, SQL performance, and production debugging across application and
  data layers. Recent contract work adds Python/FastAPI, Legal AI document automation, and
  Terraform-managed cloud delivery.
experience:
  - title: "Software Engineer - Backend & Cloud Infrastructure (Contract)"
    company: "Independent Consulting"
    date: "Sep. 2024 - Present"
    location: "Toronto, ON"
    bullets:
      - label: "Backend refactor"
        text: >-
          Reworked a FastAPI prototype into domain modules for API, persistence, and providers; added
          SQLAlchemy repositories, Alembic migrations, Shopify OAuth onboarding, validation, and tests.
      - label: "Legal AI document automation"
        text: >-
          Added dynamic DOCX rows for variable-length financial/property records in Ontario Form 13.1,
          reducing manual Word edits; reindexed fields, preserved court formatting, and added FormKit/YAML
          regression tests.
  - title: "Web Development Engineer"
    company: "Duotify Inc."
    date: "Jun. 2020 - Jan. 2024"
    location: "Taipei, Taiwan"
    intro: >-
      Maintained about 12-14 client projects concurrently and worked across 20+ over the role. The
      examples below are selected, separate client systems.
    bullets:
      - label: "Emergency medicine association website & member system"
        text: >-
          During annual conference registration, cut accounting, event, and membership admin workflows
          for about 3,000 members from 5-8 minutes/timeouts to about 5 seconds (fastest 0.4) by moving
          multi-table LINQ/AutoMapper logic into SQL Server procedures, views, and functions.
      - label: "Cathay Financial Holdings internal platform"
        text: >-
          Took over a 40-50 API .NET 5 system mid-project, built the company's first AWS dev/test
          environment under restricted client access, and delivered 4-5 APIs through on-site acceptance.
      - label: "Local-business platform"
        text: >-
          Built 20-30 .NET 5 REST APIs for a greenfield coupon, merchant, and membership platform; used
          JWT/database transactions and coordinated NSwag contracts with an Angular 12 frontend engineer.
      - label: "Top-three Taiwan used-car marketplace"
        text: >-
          Helped restore service during a week-long traffic/scraper incident (50-70k monthly visits) by
          tracing App Service saturation in Azure Monitor and configuring autoscaling while the team
          rerouted traffic.
  - title: "ERP Applications Engineer"
    company: "Unitech Computer Co., Ltd."
    date: "Mar. 2019 - May 2020"
    location: "Taipei, Taiwan"
    bullets:
      - label: "B2B ordering & modernization"
        text: >-
          Maintained a nationwide AngularJS/ASP.NET MVC ordering platform across SQL Server, PostgreSQL,
          and Oracle; fixed production/data issues and built an Angular 8/MVC 5 modernization PoC.
projects:
  - title: "content-i18n"
    subtitle: "Go Translation Orchestration"
    text: >-
      Built a Go translation tool with CLI/MCP, translation queues, batch processing, DeepL/Google
      adapters, and validation for document structure, code blocks, links, and leftover source-language
      text.
skills:
